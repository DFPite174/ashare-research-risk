[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-research-risk"
version = "0.1.0"
description = "A-Share Quantitative Research-Side Risk Management & Compliance Engine (Tradability, ADV Capacity, Concentration, Barra Attribution, Stress Testing)"
readme = "README.md"
authors = [{ name = "Quant Researcher" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
